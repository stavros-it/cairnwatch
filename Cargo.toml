[lib]
name = "cairnwatch"
path = "src/lib.rs"

[[bin]]
name = "cairnwatch"
path = "src/main.rs"

[package]
name = "cairnwatch"
version = "0.1.0"
edition = "2021"
description = "Portable GitHub/GitLab release tracker with a VirusTotal download gate"
license = "MIT"
repository = "https://github.com/stavros-it/cairnwatch"
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
    "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
globset = "0.4"
fuzzy-matcher = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", features = ["simple"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Secrets (VT key, GitHub/GitLab tokens) live in Windows Credential Manager,
# never in config.toml (user decision 2026-11-06). Native backend, no TLS.
keyring = { version = "3", features = ["windows-native"] }
# OS CSPRNG for export salt/IV (BCryptGenRandom on Windows).
getrandom = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync", "fs", "io-util"] }
futures = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
