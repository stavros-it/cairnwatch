[package]
name = "giruststatus"
version = "0.1.0"
edition = "2021"
description = "Portable GitHub/GitLab release tracker with a VirusTotal download gate"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
regex = "1"
globset = "0.4"
fuzzy-matcher = "0.3"
aes = "0.8"
cbc = "0.2"
pbkdf2 = { version = "0.12", features = ["simple"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
futures = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
